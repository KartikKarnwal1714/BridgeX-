openapi: 3.0.3
info:
  title: BridgeX API
  description: >
    A Resilient Multi-Protocol API Integration and Management Platform —
    API reference for the endpoints currently implemented. Dashboard login uses JWT bearer tokens; Gateway traffic (/gateway/{slug}/...) is authenticated with BridgeX API keys, not JWTs; see the README for the gateway contract.
  version: 1.1.0
  x-phase5-contract: >
    Phase 5 adds: one error body everywhere (components/schemas/ErrorEnvelope, codes enumerated in ErrorCode); resource-shaped URLs (PATCH /api-keys/{id}, POST /auth/sessions, POST /integrations/{id}/verifications; the older verb-style paths remain as deprecated aliases); a real GraphQL endpoint (POST /graphql) and GraphQL forwarding to configured integrations; SOAP 1.1/1.2 integrations driven by a WSDL; a shared outbound client with a timeout on every call, retry with exponential backoff + jitter, and a three-state circuit breaker. Gateway responses with the header X-BridgeX-Error are BridgeX-generated and use ErrorEnvelope; every other gateway response is the upstream's own response, passed through unchanged (BridgeX does not and cannot reshape an upstream's error format).
  x-phase4-contract: >
    Dashboard responses support JSON by default and XML through Accept negotiation; unsupported formats return 406. Successful responses generate ETags and honor If-None-Match. Private API data is no-store; health and documentation GETs use a 60-second public cache. Responses carry X-Correlation-ID. Known paths return 405 with Allow for unsupported methods. Rate-limit errors include Retry-After. Log cursor responses include meta.nextCursor and meta.next.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: APIs
  - name: Integrations
  - name: Dashboard
  - name: Analytics
  - name: Logs
  - name: API Keys
  - name: System Health
  - name: Settings
  - name: Documentation
  - name: GraphQL

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }
        message: { type: string }

    ErrorCode:
      type: string
      description: Every machine-readable code BridgeX itself can return (src/errors/catalog.js; a test keeps this list in sync).
      enum: [VALIDATION_ERROR, INVALID_JSON, INVALID_REQUEST, INVALID_PATH, INVALID_CURSOR, INVALID_IDEMPOTENCY_KEY, URI_TOO_LONG, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE, NOT_ACCEPTABLE, UNAUTHORIZED, INVALID_CREDENTIALS, INVALID_API_KEY, FORBIDDEN, ACCOUNT_INACTIVE, NOT_FOUND, ROUTE_NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, EMAIL_IN_USE, GATEWAY_ROUTE_CONFLICT, CANNOT_DELETE_SELF, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_KEY_REUSED, RATE_LIMITED, RATE_LIMIT_EXCEEDED, TOO_MANY_FAILED_ATTEMPTS, GRAPHQL_PARSE_FAILED, GRAPHQL_VALIDATION_FAILED, GRAPHQL_QUERY_TOO_COMPLEX, GRAPHQL_QUERY_TOO_DEEP, GRAPHQL_INTROSPECTION_DISABLED, GRAPHQL_MUTATION_OVER_GET, GRAPHQL_UPSTREAM_ERRORS, GRAPHQL_EXECUTION_TIMEOUT, SOAP_FAULT, SOAP_INVALID_WSDL, SOAP_UNKNOWN_OPERATION, SOAP_INVALID_RESPONSE, INTEGRATION_NOT_CONFIGURED, INTEGRATION_PROTOCOL_MISMATCH, UPSTREAM_TIMEOUT, UPSTREAM_UNREACHABLE, UPSTREAM_DNS_FAILURE, UPSTREAM_CONNECTION_RESET, UPSTREAM_TLS_ERROR, UPSTREAM_INVALID_RESPONSE, UPSTREAM_ADDRESS_BLOCKED, UPSTREAM_RESPONSE_TOO_LARGE, UPSTREAM_ERROR, UPSTREAM_REDIRECT_BLOCKED, CIRCUIT_OPEN, REQUEST_CANCELLED, SERVICE_UNAVAILABLE, SERVICE_DISABLED, NOT_READY, LOG_STORE_UNAVAILABLE, DATABASE_UNAVAILABLE, DATABASE_TIMEOUT, DATABASE_MIGRATION_REQUIRED, GATEWAY_MISCONFIGURED, INTERNAL_SERVER_ERROR]

    ErrorEnvelope:
      type: object
      required: [success, error]
      description: The single error body used by every BridgeX-generated error response (dashboard API, gateway-generated errors, rate limits, 404/405/406, GraphQL transport errors).
      properties:
        success: { type: boolean, example: false }
        requestId: { type: string, description: "Gateway responses only: same value as error.correlationId (kept for older clients)." }
        error:
          type: object
          required: [code, message, details, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: "Safe, human-readable. Never contains SQL, stack traces, secrets or internal addresses." }
            correlationId: { type: string, nullable: true, description: "The correlation id for this request (also in the X-Correlation-ID header)." }
            details:
              type: array
              items: { type: object }

    GraphQLRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, example: "query Apis($n: Int) { apis(limit: $n) { id name protocol } }" }
        variables: { type: object, nullable: true, example: { n: 5 } }
        operationName: { type: string, nullable: true, example: Apis }

    GraphQLResponse:
      type: object
      properties:
        data: { type: object, nullable: true }
        errors:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
              path: { type: array, items: {} }
              extensions:
                type: object
                properties:
                  code: { $ref: '#/components/schemas/ErrorCode' }
                  correlationId: { type: string }
        extensions: { type: object, properties: { correlationId: { type: string } } }

    GraphQLTransportError:
      description: Failure before execution. Both the unified envelope and a standard GraphQL errors array are present.
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            errors: { type: array, items: { type: object } }

    IntegrationConfig:
      type: object
      additionalProperties: false
      properties:
        wsdlUrl: { type: string, description: "SOAP: absolute URL of the WSDL (defaults to <endpoint>?wsdl)." }
        soapVersion: { type: string, enum: ['1.1', '1.2'] }
        soapIdempotent: { type: boolean, description: "SOAP: operations may be retried after transient failures." }
        healthPath: { type: string, description: "REST: path appended to the endpoint for the connection check." }

    Verification:
      type: object
      properties:
        integrationId: { type: integer }
        protocol: { type: string, enum: [REST, GRAPHQL, SOAP] }
        status: { type: string, enum: [Connected, Error] }
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer }
        details: { type: object }
        error: { type: object, properties: { code: { $ref: '#/components/schemas/ErrorCode' }, message: { type: string } } }

    SoapCall:
      type: object
      required: [operation]
      properties:
        operation: { type: string, example: Add }
        arguments: { type: object, example: { a: 2, b: 40 } }
        soapHeaders:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string, example: AuthHeader }
              namespace: { type: string, example: 'http://bridgex.test/calculator' }
              value: { oneOf: [{ type: object }, { type: string }] }

    CircuitBreakerState:
      type: object
      properties:
        key: { type: string, example: 'api:12' }
        state: { type: string, enum: [closed, open, half_open] }
        consecutiveFailures: { type: integer }
        probesInFlight: { type: integer }
        timesOpened: { type: integer }
        openedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        store: { type: string, enum: [redis, memory] }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [SUPER_ADMIN, DEVELOPER, VIEWER, SUPPORT] }
        status: { type: string, enum: [Active, Inactive] }
        created_at: { type: string, format: date-time }
        last_active: { type: string, format: date-time, nullable: true }

    Api:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        protocol: { type: string, enum: [REST, GRAPHQL, SOAP] }
        base_url: { type: string }
        status: { type: string, enum: [Healthy, Degraded, Error] }
        request_count: { type: integer }
        success_rate: { type: number }
        average_response_time: { type: integer }

    Integration:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        protocol: { type: string, enum: [REST, GRAPHQL, SOAP] }
        endpoint: { type: string }
        status: { type: string, enum: [Unverified, Error, Pending], description: "Unverified means a legacy Connected value exists, but no live connection check has confirmed it." }
        last_sync: { type: string, format: date-time, nullable: true }
        config: { $ref: '#/components/schemas/IntegrationConfig' }
        auth_mode: { type: string, enum: [none, bearer, header] }
        auth_header: { type: string, nullable: true }
        has_credential: { type: boolean, description: "A credential is stored (encrypted). The credential itself is never returned." }
        timeout_ms: { type: integer, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        last_verification_status: { type: string, nullable: true }
        last_verification_error: { type: string, nullable: true }
        last_verification_ms: { type: integer, nullable: true }

    IntegrationInput:
      type: object
      required: [name, type, protocol, endpoint]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        type: { type: string, minLength: 2, maxLength: 100 }
        protocol: { type: string, enum: [REST, GRAPHQL, SOAP] }
        endpoint: { type: string, minLength: 1, maxLength: 300 }
        status: { type: string, enum: [Error, Pending], description: "Connected is only ever set by a real verification (POST /integrations/{id}/verifications)." }
        config: { $ref: '#/components/schemas/IntegrationConfig' }
        auth_mode: { type: string, enum: [none, bearer, header] }
        auth_header: { type: string, nullable: true }
        credential: { type: string, nullable: true, writeOnly: true, description: "Stored encrypted; never returned." }
        timeout_ms: { type: integer, minimum: 100, maximum: 30000, nullable: true }

    IntegrationPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        type: { type: string, minLength: 2, maxLength: 100 }
        protocol: { type: string, enum: [REST, GRAPHQL, SOAP] }
        endpoint: { type: string, minLength: 1, maxLength: 300 }
        status: { type: string, enum: [Error, Pending] }
        config: { $ref: '#/components/schemas/IntegrationConfig' }
        auth_mode: { type: string, enum: [none, bearer, header] }
        auth_header: { type: string, nullable: true }
        credential: { type: string, nullable: true, writeOnly: true }
        timeout_ms: { type: integer, nullable: true }

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional key scoped to authenticated owner and operation; retained for 24 hours.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Accepted when 1-128 safe ASCII characters; otherwise generated by BridgeX.
      schema: { type: string, maxLength: 128 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MethodNotAllowed:
      description: Unsupported method on a known resource; response includes Allow.
      headers:
        Allow: { schema: { type: string }, description: Allowed HTTP methods }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    UpstreamError:
      description: >-
        BridgeX could not obtain a usable answer from the upstream: UPSTREAM_TIMEOUT (504), UPSTREAM_UNREACHABLE /
        UPSTREAM_DNS_FAILURE / UPSTREAM_CONNECTION_RESET / UPSTREAM_TLS_ERROR / UPSTREAM_INVALID_RESPONSE /
        UPSTREAM_ADDRESS_BLOCKED / UPSTREAM_RESPONSE_TOO_LARGE / SOAP_FAULT / GRAPHQL_UPSTREAM_ERRORS (502), or CIRCUIT_OPEN (503, with Retry-After).
      headers:
        Retry-After: { schema: { type: integer }, description: "Present for CIRCUIT_OPEN: seconds until a probe is allowed." }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CircuitOpen:
      description: The upstream's circuit breaker is OPEN; the request was rejected without contacting the upstream.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe - the process is running (checks no dependencies)
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Process is alive
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, example: 'public, max-age=60, must-revalidate' }
            X-Correlation-ID: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
            application/xml:
              schema: { type: string }
        '304': { description: Not modified; no response body }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe - 200 only when PostgreSQL is reachable (Mongo/Redis are optional)
      security: []
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '503':
          description: Not ready (database unreachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/register:
    post:
      deprecated: true
      description: Deprecated alias of POST /auth/registrations.
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role: { type: string, enum: [SUPER_ADMIN, DEVELOPER, VIEWER, SUPPORT] }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/login:
    post:
      deprecated: true
      description: Deprecated alias of POST /auth/sessions.
      tags: [Auth]
      summary: Login and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/me:
    get:
      deprecated: true
      description: Deprecated alias of GET /auth/sessions/current.
      tags: [Auth]
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update a user
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Delete a user
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204': { description: User deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /apis:
    get:
      tags: [APIs]
      summary: List registered APIs
      responses:
        '200':
          description: List of APIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    post:
      tags: [APIs]
      summary: Register a new API
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Api' }
      responses:
        '201':
          description: API created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Idempotency key is processing or was reused with a different request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /apis/{id}:
    get:
      tags: [APIs]
      summary: Get an API by ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: API
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [APIs]
      summary: Update an API
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Api' }
      responses:
        '200':
          description: API updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [APIs]
      summary: Delete an API
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204': { description: API deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations:
    get:
      tags: [Integrations]
      summary: List integrations
      responses:
        '200':
          description: List of integrations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    post:
      tags: [Integrations]
      summary: Create an integration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationInput' }
      responses:
        '201':
          description: Integration created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Key is being processed or was reused with a different request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /integrations/{id}:
    get:
      tags: [Integrations]
      summary: Get an integration by ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Integration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Integrations]
      summary: Update an integration
      description: Full replacement of mutable integration fields. Use PATCH for a partial update.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationInput' }
      responses:
        '200':
          description: Integration updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    patch:
      tags: [Integrations]
      summary: Partially update an integration
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationPatch' }
      responses:
        '200': { description: Integration updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      tags: [Integrations]
      summary: Delete an integration
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204': { description: Integration deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Aggregate dashboard KPI stats
      responses:
        '200':
          description: KPI stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /dashboard/traffic:
    get:
      tags: [Dashboard]
      summary: Traffic overview series
      responses:
        '200':
          description: Traffic series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /dashboard/protocol-distribution:
    get:
      tags: [Dashboard]
      summary: API count by protocol
      responses:
        '200':
          description: Protocol distribution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /dashboard/top-apis:
    get:
      tags: [Dashboard]
      summary: Top APIs by request volume
      responses:
        '200':
          description: Top APIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /dashboard/system-status:
    get:
      tags: [Dashboard]
      summary: Live status of core system dependencies
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /analytics/cards:
    get:
      tags: [Analytics]
      summary: Summary cards for a date range, computed from request logs (error = status >= 400)
      parameters:
        - name: from
          in: query
          description: ISO date-time. Default is 7 days before "to".
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: ISO date-time. Default is now.
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          description: Bucket size. "hour" allows at most 7 days, "day" at most 90.
          schema: { type: string, enum: [hour, day], default: day }
      responses:
        '200':
          description: Analytics cards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /analytics/traffic:
    get:
      tags: [Analytics]
      summary: Requests over time for a date range (empty when no logs exist; never synthetic)
      parameters:
        - name: from
          in: query
          description: ISO date-time. Default is 7 days before "to".
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: ISO date-time. Default is now.
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          description: Bucket size. "hour" allows at most 7 days, "day" at most 90.
          schema: { type: string, enum: [hour, day], default: day }
      responses:
        '200':
          description: Traffic series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /analytics/top-endpoints:
    get:
      tags: [Analytics]
      summary: Most-requested paths (query strings ignored) for a date range
      parameters:
        - name: from
          in: query
          description: ISO date-time. Default is 7 days before "to".
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: ISO date-time. Default is now.
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          description: Bucket size. "hour" allows at most 7 days, "day" at most 90.
          schema: { type: string, enum: [hour, day], default: day }
      responses:
        '200':
          description: Top endpoints
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /analytics/gateway:
    get:
      tags: [Analytics]
      summary: Gateway usage per API, per API key and per outcome (SUPER_ADMIN, DEVELOPER, SUPPORT only)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Gateway usage computed from the request log
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /logs:
    get:
      tags: [Logs]
      summary: Search request logs (SUPER_ADMIN, DEVELOPER, SUPPORT only)
      description: Cursor mode uses stable timestamp and unique ID ordering; response meta contains nextCursor and next (null at the final page). Page pagination remains available for existing clients.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: cursor, in: query, description: Empty on the first cursor page; otherwise pass meta.nextCursor, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: q
          in: query
          description: Literal text matched against endpoint, service and correlation id
          schema: { type: string, maxLength: 100 }
        - { name: method, in: query, schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD] } }
        - name: status
          in: query
          description: Exact code (404) or class (5xx)
          schema: { type: string }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Request logs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /logs/{id}:
    get:
      tags: [Logs]
      summary: Get one request log entry (SUPER_ADMIN, DEVELOPER, SUPPORT only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The log entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Log store (MongoDB) not connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      responses:
        '200':
          description: API keys (previews only — full key is never returned again)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    post:
      tags: [API Keys]
      summary: Create an API key. The full raw key is returned exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                environment: { type: string, enum: [Live, Test] }
      responses:
        '201':
          description: Created — includes the one-time full key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api-keys/{id}/revoke:
    patch:
      deprecated: true
      description: Deprecated. Use PATCH /api-keys/{id} with {"status":"revoked"}. Responses carry Deprecation and Link headers.
      tags: [API Keys]
      summary: Revoke an API key
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api-keys/{id}/gateway:
    patch:
      deprecated: true
      description: Deprecated. Use PATCH /api-keys/{id} with the same body.
      tags: [API Keys]
      summary: Set a key's rate limit, expiry and allowed APIs (Super Admin only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rateLimitPerMinute: { type: integer, minimum: 1, maximum: 10000 }
                expiresAt: { type: string, format: date-time, nullable: true }
                apiIds: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Gateway settings updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api-keys/{id}:
    patch:
      tags: [API Keys]
      summary: Update an API key (revoke it, or change rate limit / expiry / granted APIs)
      description: >
        Send {"status":"revoked"} to revoke (SUPER_ADMIN, or the key's owner; revocation is one-way).
        rateLimitPerMinute, expiresAt and apiIds are SUPER_ADMIN only. A key you do not own is a 404.
        Replaces PATCH /api-keys/{id}/revoke and PATCH /api-keys/{id}/gateway.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { type: string, enum: [revoked] }
                rateLimitPerMinute: { type: integer, minimum: 1, maximum: 10000 }
                expiresAt: { type: string, format: date-time, nullable: true }
                apiIds: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Key updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [API Keys]
      summary: Permanently delete an API key (Super Admin only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200': { description: Key deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /system-health:
    get:
      tags: [System Health]
      summary: Per-dependency status, latency and sampled availability (SUPER_ADMIN, DEVELOPER, SUPPORT only)
      responses:
        '200':
          description: System health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /system-health/alerts:
    get:
      tags: [System Health]
      summary: Recent error/warning alerts derived from request logs
      responses:
        '200':
          description: Recent alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /settings:
    get:
      tags: [Settings]
      summary: Get platform settings
      responses:
        '200':
          description: Platform settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    put:
      tags: [Settings]
      summary: Update platform settings (Super Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /docs/endpoints:
    get:
      tags: [Documentation]
      summary: Every real, currently registered endpoint, grouped by section
      responses:
        '200':
          description: Endpoint map
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }


  /auth/registrations:
    post:
      tags: [Auth]
      summary: Create a registration (new VIEWER account). Resource-shaped replacement for POST /auth/register.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201':
          description: Account created; a token is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/sessions:
    post:
      tags: [Auth]
      summary: Create a session (log in) and receive a JWT. Resource-shaped replacement for POST /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/sessions/current:
    get:
      tags: [Auth]
      summary: The current session's user. Replacement for GET /auth/me.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{id}/verifications:
    post:
      tags: [Integrations]
      summary: Run a real connection check for the integration and record the result
      description: >
        REST: GET endpoint+healthPath. GraphQL: POST { __typename } query. SOAP: download and parse the WSDL.
        Always goes through the shared outbound client (timeout, retry, circuit breaker, SSRF guard).
        201 with status "Connected" or "Error" (an unhealthy upstream is a result, not a request error).
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Verification recorded
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Verification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/{id}/operations:
    get:
      tags: [Integrations]
      summary: Operations discovered from a SOAP integration's WSDL
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Service, port and operations (name, soapAction, input and output shape)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not a SOAP integration (INTEGRATION_PROTOCOL_MISMATCH) or not configured (INTEGRATION_NOT_CONFIGURED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/CircuitOpen' }
        '504': { $ref: '#/components/responses/UpstreamError' }

  /integrations/{id}/graphql:
    post:
      tags: [Integrations, GraphQL]
      summary: Forward a GraphQL operation to a GRAPHQL integration's upstream endpoint
      description: >
        The document is parsed with the GraphQL parser and limited (size, depth, complexity) before it is sent.
        Queries are retried on transient failures; mutations never are. On success the upstream's JSON
        (data and/or errors) is returned unchanged. A non-2xx or non-JSON upstream answer becomes 502 GRAPHQL_UPSTREAM_ERRORS.
        Upstream credentials are added by BridgeX and never returned.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphQLRequest' }
      responses:
        '200':
          description: Upstream GraphQL result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/CircuitOpen' }
        '504': { $ref: '#/components/responses/UpstreamError' }

  /integrations/{id}/soap:
    post:
      tags: [Integrations]
      summary: Call an operation of a SOAP integration (SOAP 1.1 or 1.2, per config.soapVersion)
      description: >
        Arguments are given as JSON and serialised into a SOAP envelope by the WSDL's definition. The call is sent
        to the configured endpoint (never to the address written inside the WSDL). A SOAP Fault becomes 502 SOAP_FAULT.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoapCall' }
      responses:
        '200':
          description: SOAP response converted to JSON (data.result)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/CircuitOpen' }
        '504': { $ref: '#/components/responses/UpstreamError' }

  /graphql:
    post:
      tags: [GraphQL]
      summary: BridgeX GraphQL endpoint - queries and mutations over the same data as the REST API
      description: >
        Authentication: the same JWT bearer token as REST. Authorization: per field, with the same roles as the equivalent REST route.
        Limits: query size, depth, complexity, per-user rate limit, execution timeout; batching is not supported.
        Errors before execution (bad JSON, syntax/validation errors, limits, 401/403/429) use the HTTP status plus a body that is both the unified
        error envelope and a GraphQL `errors` array. Errors during execution return HTTP 200 with `data` and `errors`.
        Schema: see docs/GRAPHQL.md. Operations - queries: health, me, apis, api, integrations, integration, apiKeys, circuitBreakers;
        mutations: createIntegration, updateIntegration, deleteIntegration, verifyIntegration, revokeApiKey.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphQLRequest' }
      responses:
        '200':
          description: Execution result (data and/or errors)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLResponse' }
        '400':
          description: Invalid request or document (GRAPHQL_PARSE_FAILED, GRAPHQL_VALIDATION_FAILED, GRAPHQL_QUERY_TOO_DEEP, GRAPHQL_QUERY_TOO_COMPLEX, INVALID_JSON, INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLTransportError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Query too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLTransportError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504':
          description: Execution timed out (GRAPHQL_EXECUTION_TIMEOUT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLTransportError' }
    get:
      tags: [GraphQL]
      summary: Run a GraphQL query with GET (?query=&variables=&operationName=). Mutations are refused with 405.
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: variables, in: query, required: false, schema: { type: string }, description: JSON object }
        - { name: operationName, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /system-health/circuit-breakers:
    get:
      tags: [System Health]
      summary: State of every outbound circuit breaker (closed / open / half_open) and whether state is shared via Redis
      responses:
        '200':
          description: Circuit breakers
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mode: { type: string, enum: [redis, memory, memory-fallback] }
                          sharedAcrossInstances: { type: boolean }
                          circuits: { type: array, items: { $ref: '#/components/schemas/CircuitBreakerState' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system-health/circuit-breakers/{key}:
    delete:
      tags: [System Health]
      summary: Reset (close) one circuit breaker by deleting its state (Super Admin)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: 'api:12' }
      responses:
        '204': { description: Circuit reset }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/reliability:
    get:
      tags: [Analytics]
      summary: Retries, timeouts and circuit-breaker rejections per protocol for a date range
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Reliability statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
